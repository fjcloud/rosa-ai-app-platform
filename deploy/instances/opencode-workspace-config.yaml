# OpenCode reads $XDG_CONFIG_HOME/opencode/opencode.json (default: ~/.config/opencode).
# The official injector wrapper always mkdir /tmp/opencode-home/.local first. Do not
# ConfigMap-mount files under that path: kubelet creates the parents as root:root
# and the workspace user gets EACCES. XDG_* below keeps config/state on the home PVC.
#
# Developers call Models-as-a-Service (not the predictor Service). The API model id
# stays "qwen3"; the display name is Qwen3.8. After MaaS is Ready, mint a key:
#   bash deploy/inference/mint-workshop-key.sh
# That writes Secret ai-provider-openai-api-key (OPENAI_API_KEY + OPENAI_BASE_URL).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-xdg-env
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-config
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-configmap: "true"
  annotations:
    controller.devfile.io/mount-as: env
data:
  XDG_CONFIG_HOME: /home/user/.config
  XDG_DATA_HOME: /home/user/.local/share
  XDG_STATE_HOME: /home/user/.local/state
  XDG_CACHE_HOME: /home/user/.cache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-workspace-config
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-config
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-configmap: "true"
  annotations:
    controller.devfile.io/mount-as: subpath
    controller.devfile.io/mount-path: /home/user/.config/opencode
    controller.devfile.io/mount-on-start: "true"
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "qwen3": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.8",
          "options": {
            "baseURL": "{env:OPENAI_BASE_URL}",
            "apiKey": "{env:OPENAI_API_KEY}",
            "chunkTimeout": 120000,
            "timeout": 600000
          },
          "models": {
            "qwen3": {
              "name": "Qwen3.8",
              "limit": {
                "context": 40960,
                "output": 8192
              }
            }
          }
        }
      },
      "model": "qwen3/qwen3",
      "autoupdate": false
    }
  opencode.jsonc: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "qwen3": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "Qwen3.8",
          "options": {
            "baseURL": "{env:OPENAI_BASE_URL}",
            "apiKey": "{env:OPENAI_API_KEY}",
            "chunkTimeout": 120000,
            "timeout": 600000
          },
          "models": {
            "qwen3": {
              "name": "Qwen3.8",
              "limit": {
                "context": 40960,
                "output": 8192
              }
            }
          }
        }
      },
      "model": "qwen3/qwen3",
      "autoupdate": false
    }
