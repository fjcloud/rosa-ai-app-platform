apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ai-gateway-infra
  labels:
    app.kubernetes.io/part-of: maas
    maas.opendatahub.io/gateway-access: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-creds
  namespace: redhat-ai-gateway-infra
type: Opaque
stringData:
  POSTGRESQL_USER: maas
  POSTGRESQL_PASSWORD: MaasWorkshopDb16
  POSTGRESQL_DATABASE: maas
---
# Workshop/POC Postgres for MaaS API keys. Use an external database in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: redhat-ai-gateway-infra
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-creds
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "maas"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: redhat-ai-gateway-infra
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-db-config
  namespace: redhat-ai-gateway-infra
type: Opaque
stringData:
  DB_CONNECTION_URL: postgresql://maas:MaasWorkshopDb16@postgres.redhat-ai-gateway-infra.svc.cluster.local:5432/maas?sslmode=disable
