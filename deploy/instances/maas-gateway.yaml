# ROSA wildcard cert from the default IngressController. Recreate this
# Gateway if the cluster's defaultCertificate secret name changes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
    security.opendatahub.io/authorino-tls-bootstrap: "true"
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/component: gateway
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: https
      hostname: maas.apps.rosa.fja-hcp.70qk.p3.openshiftapps.com
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - llm-serving
                  - models-as-a-service
                  - redhat-ods-applications
                  - redhat-ai-gateway-infra
                  - openshift-ingress
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: 2shfd14qdhitbdi2e1l4qp7frbfuglv9-primary-cert-bundle-secret
