apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: leader-worker-set
  namespace: openshift-lws-operator
spec:
  channel: stable-v1.0
  installPlanApproval: Automatic
  name: leader-worker-set
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  config:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
