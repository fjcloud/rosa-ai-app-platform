apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: qwen3
  namespace: llm-serving
  annotations:
    openshift.io/display-name: Qwen3.8
  labels:
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  model:
    uri: hf://RedHatAI/Qwen3.8-27B-INT4
    name: qwen3
  storageInitializer:
    enabled: false
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
    volumes:
      # Preset kserve-config-llm-template already has emptyDir "model-cache".
      # Reusing that name merges PVC + emptyDir and is rejected. Use a distinct name.
      - name: hf-home
        persistentVolumeClaim:
          claimName: qwen-model-cache
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0
        command:
          - python
          - -m
          - vllm.entrypoints.openai.api_server
        args:
          - --port=8000
          - --model=RedHatAI/Qwen3.8-27B-INT4
          - --served-model-name=qwen3
          - --max-model-len=262144
          - --dtype=auto
          - --gpu-memory-utilization=0.90
          - --max-num-seqs=16
          - --trust-remote-code
          - --reasoning-parser=qwen3
          - --enable-auto-tool-choice
          - --tool-call-parser=qwen3_coder
          - --mm-encoder-tp-mode=data
          - --enable-prefix-caching
          - --ssl-certfile=/var/run/kserve/tls/tls.crt
          - --ssl-keyfile=/var/run/kserve/tls/tls.key
        env:
          - name: HF_HOME
            value: /opt/models
          - name: HF_HUB_CACHE
            value: /opt/models/hub
          - name: HF_HUB_OFFLINE
            value: "0"
          - name: TRANSFORMERS_OFFLINE
            value: "0"
          - name: HOME
            value: /opt/models
        volumeMounts:
          - name: hf-home
            mountPath: /opt/models
        resources:
          requests:
            cpu: 500m
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "2"
            memory: 24Gi
            nvidia.com/gpu: "1"
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
