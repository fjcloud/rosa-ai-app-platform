apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace, PVC, LLMInferenceService, and MaaS CRs (ModelRef, AuthPolicy, Subscription).
# Apply after MaasTenantConfig/default-tenant is Ready (admission webhook).
# Then: bash deploy/inference/mint-workshop-key.sh
resources:
  - namespace.yaml
  - model-pvc.yaml
  - llminferenceservice.yaml
  - maas-modelref.yaml
  - maas-auth-policy.yaml
  - maas-subscription.yaml
