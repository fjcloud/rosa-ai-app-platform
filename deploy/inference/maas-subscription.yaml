apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: qwen3-workshop
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: Qwen3.8 workshop subscription
    openshift.io/description: Generous token quota for the workshop; tighten this for production showback
spec:
  priority: 10
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: qwen3
      namespace: llm-serving
      tokenRateLimits:
        - limit: 5000000
          window: 24h
