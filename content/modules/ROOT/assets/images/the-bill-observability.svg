<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
<title id="title">Observe usage and explain behavior</title><desc id="desc">Keep operational signals, model evidence and cloud billing distinct.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 z" fill="#687683"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 z" fill="#0066cc"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}svg{background:white}</style>
<rect width="1120" height="790" rx="16" fill="white"/>
<rect x="40" y="36" width="38" height="5" rx="2" fill="#ee0000"/>
<text x="40" y="77" font-size="30" fill="#151515" font-weight="700" text-anchor="start" class="">Observe usage and explain behavior</text>
<text x="40" y="108" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="">Keep operational signals, model evidence and cloud billing distinct.</text>
<rect x="20" y="145" width="1080" height="220" rx="12" fill="#f6f7f9" stroke="#d5dbe1" stroke-width="1.5"/>
<text x="40" y="174" font-size="17" fill="#52606d" font-weight="600" text-anchor="start" class="">Metrics — load, capacity and consumption</text>
<g data-role="node" data-node="metrics">
<rect x="60" y="205" width="260" height="145" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="61" y="223" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="80" y="267.0" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Platform metrics</text>
<text x="80" y="304.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">DCGM + vLLM + MaaS</text>
</g>
<g data-role="node" data-node="prom">
<rect x="430" y="205" width="260" height="145" rx="12" fill="white" stroke="#ee0000" stroke-width="1.5"/>
<rect x="431" y="223" width="4" height="25" rx="2" fill="#ee0000"/>
<text x="450" y="241.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">OpenShift</text>
<text x="450" y="268.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">monitoring</text>
<text x="450" y="305.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Prometheus +</text>
<text x="450" y="329.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">ServiceMonitors</text>
</g>
<g data-role="node" data-node="console">
<rect x="800" y="205" width="260" height="145" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="801" y="223" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="820" y="255.0" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Console dashboards</text>
<text x="820" y="292.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">GPU, requests and</text>
<text x="820" y="316.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">tokens</text>
</g>
<path data-role="connector" data-source="metrics" data-target="prom" data-points="[[320, 277.5], [430, 277.5]]" d="M 320,277.5 L 430,277.5" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path data-role="connector" data-source="prom" data-target="console" data-points="[[690, 277.5], [800, 277.5]]" d="M 690,277.5 L 800,277.5" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="node" data-node="capacity">
<rect x="60" y="440" width="480" height="170" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="61" y="458" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="80" y="502.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Provisioned capacity</text>
<text x="80" y="539.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">GPU workers + storage</text>
<text x="80" y="563.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Still billed while idle</text>
</g>
<g data-role="node" data-node="quota">
<rect x="580" y="440" width="480" height="170" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="581" y="458" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="600" y="502.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Token governance</text>
<text x="600" y="539.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">MaaS limits consumption</text>
<text x="600" y="563.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">It is not an AWS spending cap</text>
</g>
<path d="M 40,734 H 1080" stroke="#d5dbe1"/>
<text x="40" y="765" font-size="16" fill="#52606d" font-weight="400" text-anchor="start" class="">Compare demand, GPU capacity and quota. Use AWS billing for actual infrastructure spend.</text>
</svg>
